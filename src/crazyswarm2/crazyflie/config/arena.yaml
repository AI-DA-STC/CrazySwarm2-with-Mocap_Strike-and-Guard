# The ROOM, as measured. NOT choreography.
#
# This file exists so the show code can be setup-agnostic: safety.py reads it
# instead of carrying this rig's numbers as Python constants. Everything here
# is a property of the physical space and the camera rig -- it changes when the
# room changes, when Motive is recalibrated, or when somebody re-flies the
# survey. Nothing here describes what a show DOES; per-show numbers (ring
# radius, speeds, engagement distances) stay with the show and are overridable
# per run with --ros-args -p.
#
# ANY OTHER ROOM MUST RE-MEASURE. Set `measured: false` and the planners refuse
# to clear a flight, which is the correct behaviour for a copy of this repo
# that has not been surveyed -- these numbers are a geofence for ONE room and
# flying someone else's geofence is how a drone meets a wall.
#
#   scripts/arena_flight_sweep.py    re-earns radius and ceiling
#   scripts/measure_arena.py         re-earns the centroid

arena:
  # true only when the numbers below were measured in THIS room.
  #
  # !! 2026-11-02: THE RIG MOVED TO THE BIG ARENA (new cameras, new calibration,
  # !! new world frame). The `arena:` numbers below were RE-MEASURED there by a
  # !! CARRIED survey (scripts/measure_arena.py, cf5 walked by hand for 240 s,
  # !! 11999 samples, data/arena/bigarena_carried_cf5_2026-11-02.csv), then a
  # !! FLOWN sweep the same day (scripts/arena_flight_sweep.py, cf5, data/arena/
  # !! bigarena_{climb_edge,band1.2,band2.0}_cf5_2026-11-02.csv):
  # !!   - climbs at ~3.4 m out (+x): to the 3.00 m and 6.00 m caps clean, then
  # !!     a climb to a 10 m cap LOST TRACKING just above 7.23 m (the last
  # !!     tracked sample; the 7.00 m step was clean, 7.25 m was not). The
  # !!     cameras are mounted below the ~15 m roof, so this is their limit. The
  # !!     watchdog dropped cf5 to 1.2 m, tracking returned ~2 s into the
  # !!     descent, and it landed normally. data/arena/
  # !!     bigarena_climb{6,10}_edge_cf5_2026-11-02*.csv.
  # !!   - one full loop of the band 3.32 -> 3.85 m at 1.2 m and again at 2.0 m:
  # !!     every waypoint tracked, worst pose age 0.02 s. The loop is a spiral, so
  # !!     each bearing was flown at ONE radius (3.44 m at +y, the bearing closest
  # !!     to the furniture; 3.85 m at +x).
  # !!   - a drone landed at 3.88 m (+x) stayed tracked on the floor.
  # !! The old room's survey is git tag `pre-big-arena`.
  # !!   - Tracking held EVERYWHERE the body went: no dropout at all, largest
  # !!     gap between samples 25 ms. So tracking is not what limits the arena;
  # !!     the ROOM is. The floor is not a square: furniture leaves a chamfer at
  # !!     ROS (-x, +y) (near the old cf3 mark) and a step towards -x, and the
  # !!     walker deliberately stayed clear of both. (Motive axes: Motive -z is
  # !!     ROS +y.) Walked distance from centre per 10 deg bearing goes as low as
  # !!     4.07 m at +y (80-90 deg), 4.30 m at 200-210 deg and 4.44 m at 160-170
  # !!     deg, and up to 7.29 m at -y.
  # !!   - radius_tested is the SHORTEST walked bearing (4.07 m) minus the
  # !!     carried-survey edge margin (0.30 m). Do NOT read the 45 deg sector
  # !!     maxima measure_arena.py prints as a radius: the maximum within a wide
  # !!     sector hides the furniture (this file briefly said 4.70 m because of
  # !!     exactly that).
  # !!   - Ceilings: 7.00 m, the highest step flown clean; tracking ends at
  # !!     ~7.2 m. Measured at the EDGE only (~3.4 m out, +x); the centre was not
  # !!     climbed, so the centre value is the edge's. Shows plan to ceiling minus
  # !!     tracking_margin, but their own heights are far lower; anything that
  # !!     actually flies high should remember a loss up there is a blind descent.
  # !!     (The carried walk reached 2.13 m, as high as a person can reach.)
  # !!   - Floor level: tracked at the centre and at 3.88 m (+x). Four drones
  # !!     parked at the room's far corners (outside this arena) were not tracked
  # !!     at all. Check that a parked drone is streaming before trusting a mark
  # !!     near the edge.
  # !!   - centre was kept, not re-derived: it is where the shows are anchored, and
  # !!     the survey measured radii FROM it. The 2026-10-08 frame history and the
  # !!     per-sector bearings in the comments below describe the OLD room.
  # !!   - The ground plane is gravity-level and the floor is not: grounded
  # !!     drones read z of about -0.03..+0.06 depending on where they stand.
  # !! THE ARENA IS NOW `polygon:` (below), not the circle. Measured the same
  # !! day: a carried two-lap BOUNDARY walk hugging the walls, the chamfer and
  # !! the step (data/arena/bigarena_boundary_lap_cf5_2026-11-02.csv); each
  # !! edge is 0.30 m inside where that lap typically ran. Then FLOWN: ray
  # !! probes along +x/-y/-x/+y and one tour round the polygon's own edges at
  # !! 1.5 m (data/arena/bigarena_{ray_*,tour}_cf5_2026-11-02.csv), tracked
  # !! everywhere, worst pose age 0.02 s, every flown sample inside it.
  # !! The circle (centre + radius_tested) is now the largest circle about
  # !! centre that fits INSIDE the polygon (4.07 m, to the step), kept for the
  # !! geometry that needs a centre: the escort's ring and fence, figure sizes.
  # !! Containment checks (safety.check_show/check_envelope, the constellation
  # !! marks) use the polygon. Pass --centre to arena_flight_sweep.py; its
  # !! default is the old room's.
  measured: true

  #: Centroid of the TRACKED VOLUME -- not the room's geometric centre, and not
  #: the centroid of where the drones happen to be parked.
  #:
  #: MEASURED 2026-10-01 by walking cf1 through the volume
  #: (scripts/measure_arena.py, 8067 samples).
  #:
  #: RE-EXPRESSED 2026-10-08 after Motive was recalibrated and the rigid bodies
  #: renamed. The room, the cameras and the surveyed volume did not change --
  #: only the definition of the world frame. The transform was fitted on cf1,
  #: cf3 and cf5, whose marks had not been touched and whose pairwise distances
  #: still agreed with the yaml to <= 21 mm, which is what proves the FRAME
  #: moved rather than the drones:
  #:     old -> new: rotate +91.59 deg, translate [+0.043, -0.098] m
  #:     residual max 0.0159 m, scale 0.9947
  #:     (0.033, 0.255) -> (-0.213, -0.072), i.e. 0.410 m
  #: Corroborated independently: the escort marks stand the defenders at
  #: 1.40 / 0.40 / 1.40 m from this centroid, and from the NEW value the parked
  #: drones read 1.44 / 0.38 / 1.41 m (max error 36 mm); from the OLD value
  #: 1.03 / 0.72 / 1.37 m, which matches nothing.
  #:
  #: A DIRECTION is not a point. If the frame moves again, bearings must be
  #: ROTATED as well as this point translated -- escort's vip_offset and both
  #: adversary bearings were missed on 2026-10-08 and the attacker's waiting
  #: station landed 2.70 m out, outside the arena AND outside radius_lost.
  centre: [-0.213, -0.072]      # m, [x, y]

  #: Flown clean at 1.20 m AND 1.95 m altitude (arena_flight_sweep.py --mode
  #: spiral, cf3, 72 waypoints, 3477 samples): zero stale poses and zero follow
  #: failures anywhere inside it, worst pose age 0.02 s in every radius band.
  #: That run also covers the high-and-far corner (1.95 m altitude at 1.96 m
  #: radius) that neither carried survey reached.
  #:
  #: HOW IT WAS EARNED, three independent methods on 2026-10-01. Every show
  #: used to inherit arena_radius 2.5 m and ceiling 2.0 m from the follow-drone
  #: prototype, and neither had ever been checked against this room. The room
  #: is SMALLER in radius than the inherited numbers, and a different shape:
  #:   1. Carried surveys (measure_arena.py, cf1 walked by hand, 2 runs,
  #:      15k samples).
  #:   2. Flown radius (arena_flight_sweep.py --mode spiral, cf1 at 1.20 m):
  #:      lost tracking at 2.24 m -> radius_lost below.
  #:   3. Flown climb (--mode climb, cf5 near centre): clean to the 2.42 m cap,
  #:      pose age never above 0.02 s. The ceiling is ABOVE that, unmeasured.
  #:
  #: TRACKING IS NOT ISOTROPIC, which is why this is a single conservative
  #: number rather than the best case. By 45 deg sector the first sustained
  #: dropout sits at 2.15 m (270-315), 2.25 m (0-45), 2.31 m (225-270), and
  #: never in 180-225, which held past 2.46 m. A show planned to the best
  #: sector would leave the volume in the worst one. NOTE: those sector
  #: bearings were measured in the PRE-2026-10-08 world frame -- the frame has
  #: since rotated ~91.6 deg, so add that before reasoning about which
  #: physical part of the room is weakest.
  #:
  #: A show that plans outside radius_tested is planning somewhere nothing has
  #: flown. Re-measure before raising it; do not assume the old 2.5 m.
  radius_tested: 4.05           # m  big arena: the largest circle about centre INSIDE `polygon` (4.07 m, to the step); old room 2.00

  #: Where a flying drone ACTUALLY lost tracking (carried survey, 2026-10-01).
  #: Plans never go here; it is the evidence behind radius_tested.
  radius_lost: 4.35             # m  big arena: NOT a dropout -- the furniture/wall behind the polygon's nearest edge (polygon + 0.30). Old room 2.24

  #: The volume is a truncated cone -- wide through the flight band, pinching
  #: near the ceiling. A single "ceiling" number is meaningless without saying
  #: at what radius, which is why there are three.
  ceiling_tested: 7.00          # m  big arena, FLOWN clean to 7.00 m at ~3.4 m out; tracking LOST above ~7.23 m (old room: 1.95)
  ceiling_centre_tested: 7.00   # m  big arena: the edge climb's value; the centre was not climbed separately (old room: 2.42)
  ceiling_pinch_radius: 4.05    # m  big arena: no pinch seen; set to radius_tested (old room: 2.00)

  #: THE ROOM, plan view, ROS frame (Motive x = x, Motive -z = y), vertices
  #: counter-clockwise. A rectangle with the furniture chamfer cut off the
  #: (-x, +y) corner (vertices 2-3) and the step on the -x side (4-5). Each edge
  #: is 0.30 m inside the boundary lap; plans keep a further tracking_margin.
  #: A drone flew round exactly this outline, tracked all the way (2026-11-02).
  #: Remove the key and every check falls back to the circle above.
  polygon:
    - [ 5.32, -5.28]
    - [ 5.32,  4.63]
    - [-3.97,  4.63]   # chamfer
    - [-5.10,  3.51]   # chamfer
    - [-5.10,  0.56]   # step
    - [-4.27, -0.44]   # step
    - [-4.27, -5.28]

separation:
  #: The hard floor. Two drones closer than this is a near miss, not a tight
  #: formation. A property of the airframe and the downwash, not of the room --
  #: but it lives here because it is the other half of what a plan is checked
  #: against, and splitting them across two files is how one gets edited alone.
  minimum: 0.80                 # m

  #: What the flown show loses to controller lag, so a PLAN must hold
  #: minimum + margin and a plan must stay inside radius_tested - margin.
  tracking_margin: 0.10         # m
