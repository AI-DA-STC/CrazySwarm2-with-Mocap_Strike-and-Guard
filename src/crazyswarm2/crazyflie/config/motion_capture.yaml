/motion_capture_tracking:
  ros__parameters:
    # one of "optitrack", "optitrack_closed_source", "vicon", "qualisys", "nokov", "vrpn", "motionanalysis"
    type: "optitrack" #"optitrack_closed_source"
    # IPv4 of the PC running Motive. "auto" = launch.py finds it with a NatNet
    # discovery ping (UDP 1510 broadcast) — use this in the lab, where the Motive
    # PC's DHCP address has drifted (.100 → .124 → .152) and each drift silently
    # killed /poses. Override without editing this file:
    #   ros2 launch crazyflie launch.py mocap_hostname:=192.168.9.152
    #   export CRAZYSWARM_MOCAP_HOST=192.168.9.152
    hostname: "auto"
    # Ceiling on /poses (0 = every Motive frame). Every /poses message becomes a
    # radio broadcast to the drones, and Motive may run at 240 Hz when the
    # Starlings share the volume. Steps down only: at Motive's 50 Hz every frame
    # passes untouched (55, not 50, because Motive really sends 50.2 Hz and a
    # 50 ceiling drops one frame in ~250); at 240 Hz it gives 55, inside the
    # server's 40-60 Hz warning band. Vendored-node patch 0006
    # (src/motion_capture_tracking/VENDORED.md).
    max_rate: 55.0

    topics:
      frame_id: "world" #mocap
      poses:
        qos:
          mode: "sensor"
          deadline: 50.0 # Hz, = the Motive streaming rate
      tf:
        child_frame_id: "{}_mocap" #"cf1" 

    marker_configurations:
      default: # for standard Crazyflie
        offset: [0.0, 0.0, 0.0]
        points:
          p0: [   0.0,    0.0, 0.022]  # top
          p1: [-0.042,  0.042, 0.0  ]  # back left   (M3)
          p2: [-0.042, -0.042, 0.0  ]  # back right  (M2)
          p3: [ 0.042, -0.042, 0.0  ]  # front right (M1)
      default_single_marker:
        offset: [0.0, -0.01, -0.04]
        points:
          p0: [0.0177184,0.0139654,0.0557585]
      mocap_deck:
        offset: [0.0, 0.0, -0.01]
        points:
          p0: [0.03, 0.0, 0.0] # front
          p1: [0.00, -0.03, 0.0] # right
          p2: [-0.015, 0.0, 0.0] # back
          p3: [0.00, 0.03, 0.0] # left
      medium_frame:
        offset: [0.0, 0.0, -0.03]
        points:
          p0: [-0.00896228,-0.000716753,0.0716129]
          p1: [-0.0156318,0.0997402,0.0508162]
          p2: [0.0461693,-0.0881012,0.0380672]
          p3: [-0.0789959,-0.0269793,0.0461144]
      big_frame:
        offset: [0.0, 0.0, -0.06]
        points:
          p0: [0.0558163,-0.00196302,0.0945539]
          p1: [-0.0113941,0.00945842,0.0984811]
          p2: [-0.0306277,0.0514879,0.0520456]
          p3: [0.0535816,-0.0400775,0.0432799]

    dynamics_configurations:
      default:
        max_velocity: [2, 2, 3] # m/s
        max_angular_velocity: [20, 20, 10] # rad/s
        max_roll: 1.4 #rad
        max_pitch: 1.4 #rad
        max_fitness_score: 0.001

    # Rigid bodies will be automatically generated by the launch file
    # rigid_bodies:
